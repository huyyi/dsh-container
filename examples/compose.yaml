# 直接使用上游宿主，插件独立挂载并手动安装。
services:
  dsh:
    image: ${DSH_IMAGE:-ghcr.io/niyueee/dsh-container:dsh-v0.2.2-rc.2}
    container_name: dsh
    restart: unless-stopped
    ports:
      - "127.0.0.1:3081:3081"
    # 扩大访问范围前，同时配置认证、TLS 和可信网络。
    # environment:
    #   DSH_PROXY_USER: admin
    #   DSH_PROXY_PASSWORD: replace-with-a-strong-password
    volumes:
      - dsh-home:/home/dsh
      # 已打包插件挂载到持久化 home 之外，并保持路径稳定。
      # - /absolute/path/to/package/plugin:/opt/offline-plugins/genui:ro

volumes:
  dsh-home:
