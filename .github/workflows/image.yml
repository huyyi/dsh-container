name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# main 发布串行，避免并发覆盖 latest；PR 按分支隔离。
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.meta.outputs.build }}
      publish: ${{ steps.meta.outputs.publish }}
      base_image: ${{ steps.meta.outputs.base_image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate scripts, docs and CI rules
        run: |
          bash -n container/*.sh tests/*.sh
          shellcheck container/*.sh tests/*.sh
          python3 tests/validate-docs.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          docker compose -f examples/compose.yaml config --quiet
      - name: Classify changes and resolve pinned version
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/image_metadata.py >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    if: needs.validate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: needs.validate.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and load for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: dsh-validation:local
          build-args: |
            BASE_IMAGE=${{ needs.validate.outputs.base_image }}
            BUILD_VERSION=${{ needs.validate.outputs.image_tag }}
            BUILD_GIT_SHA=${{ github.sha }}
            BUILD_GIT_REF=${{ github.ref_name }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Verify runtime, A2A and TUI installation
        run: bash tests/extensions.sh dsh-validation:local
      # 只推送刚刚通过测试的本地镜像，不另跑一次构建。
      - name: Push tested platform image
        if: needs.validate.outputs.publish == 'true'
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.image_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          platform_tag="$IMAGE:$TAG-$ARCH"
          docker tag dsh-validation:local "$platform_tag"
          docker push "$platform_tag"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$platform_tag")"
          digest="${digest##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: needs.validate.outputs.publish == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture version and latest
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          set -euo pipefail
          sources=()
          for file in digests/*; do
            digest="${file##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG"
          echo "Published $IMAGE:$TAG and $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
